# Light vehicles: towing and loading rules.
# Source: NZTA "Guide to safe loading and towing for light vehicles" (updated December 2020).
# `source.page` is the PDF page (what ingest records); `source.printed_page` is the number printed on the page.
# `candidate_rows` are the rule_id values in docs/candidates/candidates_28_verified_with_gaps.csv.

- id: TOW_001
  vehicle_class: light
  authority: NZTA
  topic: unbraked_trailer_weight
  rule_type: guidance
  rule: >
    NZTA recommends, as a guide, that the laden weight of an unbraked trailer should
    not exceed three quarters of the unladen weight of the towing vehicle, and then
    only if the towing vehicle's brakes and tyres are in excellent condition. This is
    a recommendation, not a legal limit; the legal test is the brake performance
    requirement in TOW_003.
  source:
    document: Guide to safe loading and towing for light vehicles
    file: nzta_safe_loading_towing_light.pdf
    page: 4
    printed_page: 2
    section: How much can your vehicle tow safely?
  candidate_rows: [TOW_001]
  last_reviewed: "2026-10-07"

- id: TOW_002
  vehicle_class: light
  authority: NZTA
  topic: towbar_downforce
  rule_type: guidance
  rule: >
    When loading a trailer, there should be a downwards force on the towbar at the
    point of attachment equal to about 10% of the weight of the trailer plus its load.
    Do not put too much weight at the back of the trailer. The tow bar and tow
    coupling must be strong enough to safely tow the fully laden trailer, and the tow
    bar must be fitted so towing forces transfer to the towing vehicle's structure
    without distorting the tow bar or the vehicle's bodywork or structure.
  source:
    document: Guide to safe loading and towing for light vehicles
    file: nzta_safe_loading_towing_light.pdf
    page: 6
    printed_page: 4
    section: Tow bars and tow couplings
  candidate_rows: [TOW_002]
  last_reviewed: "2026-10-07"

- id: TOW_003
  vehicle_class: light
  authority: NZTA
  topic: combination_brake_performance
  rule_type: legal_requirement
  rule: >
    Every light vehicle and trailer combination must be capable of stopping within
    7 metres from a speed of 30 km/h. The service brakes on the towing and towed
    vehicles must together achieve this.
  source:
    document: Guide to safe loading and towing for light vehicles
    file: nzta_safe_loading_towing_light.pdf
    page: 8
    printed_page: 6
    also_at_pages: [4]
    section: Performance requirements for brakes on light trailers
  candidate_rows: [TOW_003]
  last_reviewed: "2026-10-07"

- id: TOW_004
  vehicle_class: light
  authority: NZTA
  topic: trailer_brake_requirements
  rule_type: legal_requirement
  rule: >
    Brake requirements for a light trailer depend on its gross laden weight.
    2000 kg or less: a service brake is not required, but if fitted it must act on
    each wheel of at least one axle; a parking brake is not required; a breakaway
    brake is required unless the trailer has an appropriate coupling and a safety
    chain. 2001 to 2500 kg: a service brake is required (direct or indirect); a
    parking brake is not required; a breakaway brake is required unless the trailer
    has an appropriate coupling and two safety chains. 2501 to 3500 kg: a service
    brake (direct or indirect) must act on each wheel of at least one axle; a parking
    brake is required and must act on at least one complete axle; a breakaway brake
    is required unless the trailer has an appropriate coupling and two safety chains.
  source:
    document: Guide to safe loading and towing for light vehicles
    file: nzta_safe_loading_towing_light.pdf
    page: 8
    printed_page: 6
    section: Requirements for service brakes, parking brakes, breakaway brakes and safety chains on light trailers (table)
  candidate_rows: [TOW_004, TOW_005, TOW_006]
  last_reviewed: "2026-10-07"

- id: TOW_007
  vehicle_class: light
  authority: NZTA
  topic: overhanging_load_warning_devices
  rule_type: legal_requirement
  rule: >
    If a load, including equipment used to support or retain it, extends more than
    200 mm beyond the sides of a light vehicle or trailer, or more than 1 metre
    beyond the front or back of the vehicle, suitable warning devices must be
    attached. In daylight these are flags or standard hazard warning panels at least
    400 mm long by 300 mm wide; in darkness, lights on the load.
  source:
    document: Guide to safe loading and towing for light vehicles
    file: nzta_safe_loading_towing_light.pdf
    page: 14
    printed_page: 12
    section: Loads overhanging the vehicle or trailer
  candidate_rows: []
  last_reviewed: "2026-10-07"
